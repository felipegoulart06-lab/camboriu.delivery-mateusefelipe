<div class="{% if field.name == 'address' or field.name == 'notes' or field.name == 'description' %}wide{% endif %}{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
</div>
