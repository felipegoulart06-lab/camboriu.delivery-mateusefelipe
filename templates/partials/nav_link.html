<a href="{% url target %}" class="{% if request.resolver_match.url_name == target or request.resolver_match.url_name == target|add:'_pdf' %}active{% endif %}">{{ label }}{% if badge or badge_key %}<span class="nav-badge"{% if badge_key %} data-live-badge="{{ badge_key }}"{% endif %}{% if not badge %} hidden{% endif %}>{{ badge }}</span>{% endif %}</a>
